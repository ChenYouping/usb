name: Build NcmProbe IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (manual runs only)'
        required: false
        default: 'manual'
      bundle_id:
        description: 'Bundle ID (must be unique to your Apple ID)'
        required: false
        default: 'com.yourname.NcmProbe'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Build unsigned app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.yourname.NcmProbe' }}
        run: |
          xcodebuild \
            -project NcmProbe.xcodeproj \
            -scheme NcmProbe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package ad-hoc signed IPA
        run: |
          APP="./DerivedData/Build/Products/Release-iphoneos/NcmProbe.app"
          test -d "$APP" || { echo "::error::built app not found at $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --deep --sign - Payload/NcmProbe.app
          zip -qry NcmProbe.ipa Payload
          ls -lh NcmProbe.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NcmProbe-IPA
          path: NcmProbe.ipa
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NcmProbe ${{ inputs.tag || github.ref_name }}
          files: NcmProbe.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
